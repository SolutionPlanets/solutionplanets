<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Illustration of DNS propagation: a website address connecting through a global network of servers, with a clock showing the delay before changes take effect">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1330"/>
      <stop offset="55%" stop-color="#0B2C7A"/>
      <stop offset="100%" stop-color="#0161EF"/>
    </linearGradient>
    <radialGradient id="globeFill" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2E6CFF"/>
      <stop offset="100%" stop-color="#0154CF"/>
    </radialGradient>
    <linearGradient id="cardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE6FF"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- ambient glow -->
  <circle cx="860" cy="300" r="230" fill="#6D28D9" opacity="0.35" filter="url(#soft)"/>
  <circle cx="260" cy="470" r="170" fill="#0161EF" opacity="0.30" filter="url(#soft)"/>

  <!-- scattered dot field -->
  <g fill="#FFFFFF" opacity="0.35">
    <circle cx="120" cy="90" r="3"/>
    <circle cx="180" cy="150" r="2"/>
    <circle cx="90" cy="230" r="2.5"/>
    <circle cx="1080" cy="120" r="3"/>
    <circle cx="1130" cy="200" r="2"/>
    <circle cx="1000" cy="80" r="2.5"/>
    <circle cx="1120" cy="480" r="2.5"/>
    <circle cx="60" cy="500" r="2"/>
  </g>

  <!-- global network sphere (right) -->
  <g transform="translate(860,300)">
    <circle r="190" fill="url(#globeFill)" opacity="0.9"/>
    <g stroke="#BFD4FF" stroke-width="1.5" fill="none" opacity="0.55">
      <ellipse rx="190" ry="60"/>
      <ellipse rx="190" ry="60" transform="rotate(60)"/>
      <ellipse rx="190" ry="60" transform="rotate(120)"/>
      <circle r="130"/>
      <circle r="70"/>
    </g>
    <!-- DNS server nodes around the globe -->
    <g fill="#FFFFFF">
      <circle cx="-150" cy="-80" r="7"/>
      <circle cx="140" cy="-110" r="7"/>
      <circle cx="180" cy="60" r="7"/>
      <circle cx="-40" cy="170" r="7"/>
      <circle cx="-190" cy="30" r="7"/>
      <circle cx="30" cy="-190" r="7"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.6">
      <line x1="-150" y1="-80" x2="0" y2="0"/>
      <line x1="140" y1="-110" x2="0" y2="0"/>
      <line x1="180" y1="60" x2="0" y2="0"/>
      <line x1="-40" y1="170" x2="0" y2="0"/>
      <line x1="-190" y1="30" x2="0" y2="0"/>
      <line x1="30" y1="-190" x2="0" y2="0"/>
    </g>
  </g>

  <!-- browser / address bar card (left) -->
  <g transform="translate(120,230)">
    <rect width="430" height="150" rx="16" fill="url(#cardFill)"/>
    <rect x="0" y="0" width="430" height="34" rx="16" fill="#0B1330" opacity="0.9"/>
    <rect x="0" y="18" width="430" height="16" fill="#0B1330" opacity="0.9"/>
    <circle cx="20" cy="17" r="5" fill="#FF5F57"/>
    <circle cx="38" cy="17" r="5" fill="#FEBC2E"/>
    <circle cx="56" cy="17" r="5" fill="#28C840"/>
    <rect x="24" y="52" width="382" height="34" rx="8" fill="#EEF3FF" stroke="#0161EF" stroke-width="1.5"/>
    <circle cx="42" cy="69" r="6" fill="none" stroke="#0154CF" stroke-width="2"/>
    <line x1="47" y1="74" x2="53" y2="80" stroke="#0154CF" stroke-width="2" stroke-linecap="round"/>
    <text x="66" y="75" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#0B1330">yourwebsite.com</text>
    <!-- arrow to IP -->
    <g transform="translate(24,108)">
      <rect width="150" height="26" rx="6" fill="#0161EF"/>
      <text x="75" y="18" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF">Domain Name</text>
      <path d="M158 13 L184 13" stroke="#0B1330" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="192" y="0" width="190" height="26" rx="6" fill="#6D28D9"/>
      <text x="287" y="18" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF">192.0.2.1 (IP Address)</text>
    </g>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0B1330"/>
    </marker>
  </defs>

  <!-- propagation waves between card and globe -->
  <g stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.5">
    <path d="M560 300 C 640 260, 680 340, 760 300" stroke-dasharray="4 10"/>
  </g>

  <!-- clock motif: changes take time -->
  <g transform="translate(940,470)">
    <circle r="72" fill="#0B1330" opacity="0.55"/>
    <circle r="72" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle r="4" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="0" y2="-46" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="34" y2="18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#FFFFFF" stroke-width="2" opacity="0.8">
      <line x1="0" y1="-64" x2="0" y2="-58"/>
      <line x1="0" y1="64" x2="0" y2="58"/>
      <line x1="-64" y1="0" x2="-58" y2="0"/>
      <line x1="64" y1="0" x2="58" y2="0"/>
    </g>
  </g>
</svg>
